[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "eudr-compliance"
version = "0.1.0"
description = "Satellite-based EUDR compliance analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Satellite / STAC
    "pystac-client>=0.7.0",
    "rasterio>=1.3.0",
    "requests>=2.31.0",
    # Cloud detection
    "s2cloudless>=1.7.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    # Geospatial
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "osmnx>=1.7.0",
    # Image processing
    "scikit-image>=0.21.0",
    "opencv-python>=4.8.0",
    # Visualisation
    "matplotlib>=3.7.0",
    "folium>=0.14.0",
    # Report generation
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
    # Environment
    "python-dotenv>=1.0.0",
    # Deep Learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Google Earth Engine
    "earthengine-api>=0.1.370",
    # GeoTESSERA embeddings
    "geotessera>=0.1.0",
]

[project.scripts]
eudr-run = "src.pipeline_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "GEE_dynamic*", "NDVI_pred*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
preview = true                 # for PLW1514 only: explicit-preview-rules keeps every other preview rule off
explicit-preview-rules = true
select = [
    "E", "F", "W", "I",
    "B",        # likely bugs (unused loop variables, raise without from, ...)
    "ARG",      # unused arguments left after a refactor
    "RUF059",   # unused unpacked variables
    "SIM115",   # files opened without a context manager
    "PLW1514",  # text files opened without an explicit encoding (Windows defaults to cp1252)
    "C90",      # functions too complex to read in one go
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import not at top — intentional: logger declared before path-dependent imports
    "W291",   # trailing whitespace in code
    "W293",   # trailing whitespace in blank lines (common in docstrings)
    "B905",   # zip(strict=...): the lengths are equal by construction here
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# the legacy pipeline predates these rules; the Hansen audit (hansen_audit/, scripts/hansen_audit/, tests_hansen_audit/) follows all of them
"src/**" = ["B", "ARG", "RUF059", "C90"]
"main_audit.py" = ["B", "ARG", "RUF059", "C90"]
"GEE_dynamic/**" = ["B", "ARG", "RUF059", "C90", "PLW1514", "SIM115"]
"NDVI_pred/**" = ["B", "ARG", "RUF059", "C90", "PLW1514", "SIM115"]
"tests/**" = ["B", "ARG", "RUF059", "C90", "PLW1514", "SIM115"]
